# config.yml

tokenizer:
  extra_chars: "abcdefghijklmnopqrstuvwxyz0123456789- *;+=\n"   # digits + operators + separators

model:
  n_embd: 64
  n_head: 4
  n_layer: 4
  dropout: 0.1
  block_size: 64

training:
  batch_size: 256
  learning_rate: 3.0e-4
  weight_decay: 0.01
  max_iters: 2500
  eval_every: 500
  seed_data: 42
  seed_model: 1337
  device: auto                                # "auto" | "cuda" | "cpu"

data:
  num_samples: 30000
  val_size: 1000

evaluation:
  eval_samples_during_training: 500
  eval_samples_final: 500

experiment:
  rhos: [0.0, 0.1, 0.15, 0.3, 0.5, 0.7, 0.8, 0.85, 0.9, 0.95, 1.0]
  output_csv: "output/rho_results.csv"