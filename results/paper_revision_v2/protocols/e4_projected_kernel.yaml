# E4 theory-matched **projected** simplex kernel (not row-softmax logits).
# Distinct from configs/experiments/escape_time.yaml / python -m src escape.
# Top-level keys are the CPU smoke. Confirmation grid is recorded, not launched.
experiment: e4_projected_kernel
parameterization: projected_simplex
not: row_softmax_logits
compile: false
device: cpu
depths: [2]
eps: [0.3]
seeds: [1]
k: 4
m: 2
lr: 0.05
max_steps: 30
out: results/paper_revision_v2/e4_projected_kernel/smoke.csv
note: "Numerics do not prove T2. See Paper/T2_CANDIDATE.md."

confirmation:
  do_not_launch_from_week2: true
  depths: [2, 3, 4, 6]
  eps: [0.6, 0.4, 0.28, 0.2]
  seeds: [1, 2, 3]
  k: 8
  m: 4
  lr: 0.05
  max_steps: 2000
  out: results/paper_revision_v2/e4_projected_kernel/confirm.csv
