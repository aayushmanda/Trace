# Confirmation protocol for causal identification (deep outcome architecture).
# Do NOT launch a depth grid from this file. One --depth at a time, hours on GPU.
# Prefer cuda:2 / cuda:3. --no-compile. Requires --confirm.
#
# This is the mechanism test: L_out vs L_out+local vs process on a D-block
# outcome net (answer-only). Mixed-format P̂_g is a negative transfer result,
# not this run. Report C_t vs D; do not claim ε^{D-1} unless mixing is verified.
# Probes and causal patches: nnsight.NNsight traces. C_t stays in autograd.
experiment: causal_identification
do_not_launch: true
mechanism_test: true
interventions: nnsight
lambda_local: 1.0
lambda: 1.0
depth: 2
seed: 42
steps: 2000
train_size: 10000
val_size: 256
probe_size: 128
patch_circuits: 32
batch_size: 64
lr: 0.002
grad_clip: 1.0
probe_steps: 200
probe_lr: 0.05
train_eval_size: 64
train_seed: 123
val_seed: 8000
probe_seed: 9000
batch_seed: 2026
checkpoints: [0, 200, 500, 1000, 1500, 2000]
compile: false
bf16: false
device: cuda:2
output: results/paper_revision_v2/causal_identification/confirm_depth2_seed42
conditions: [outcome, outcome_local, process]
note: >
  Confirmation. python -m src outcome-local --config configs/experiments/causal_identification.yaml
  --confirm --depth 2 --device cuda:2 --no-compile
  Then repeat --depth 4, 6, 8 into sibling output dirs. Do not loop from RUN.md.

depths: [2, 4, 6, 8]
seeds: [42]
confirmation:
  do_not_launch: true
  depths: [2, 4, 6, 8]
  seeds: [42]
  steps: 2000
  train_size: 10000
  val_size: 256
  lambda_local: 1.0
