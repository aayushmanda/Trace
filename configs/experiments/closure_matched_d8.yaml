# One-seed D=8 matched-architecture confirmation. Hours on GPU. Requires --confirm.
# Not a 20-seed grid. Process is the D-block outcome net, not the one-block process.
experiment: closure_matched_d8
do_not_launch: true
mechanism_test: true
matched_architecture: true
induced_credit: true
induced_backgrounds: 2
lambda_local: 1.0
depth: 8
seed: 42
steps: 6000
train_size: 10000
val_size: 256
probe_size: 64
patch_circuits: 16
batch_size: 128
lr: 0.0005
grad_clip: 1.0
probe_steps: 40
probe_lr: 0.05
train_eval_size: 64
train_seed: 123
val_seed: 8000
probe_seed: 9000
batch_seed: 2026
checkpoints: [0, 200, 500, 1000, 2000, 4000, 6000]
skip_trained_patches: false
compile: false
bf16: false
device: cuda:2
output: results/closure_handcoded/matched_d8_seed42
conditions: [outcome, outcome_local, process]
note: >
  python -m src outcome-local --config configs/experiments/closure_matched_d8.yaml
  --confirm --depth 8 --device cuda:2 --no-compile --matched-architecture --induced-credit
