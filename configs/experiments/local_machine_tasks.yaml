# Documentary defaults for the local-machine task families.
# `python -m src supervision` does not load this file; pass the flags on the CLI.
# Tiny smoke only — not a paper-scale cell.
experiment: supervision
tasks:
  - tape_machine_8
  - queue_machine_8
  - grid_walk_8
modes: [outcome, process]
seeds: [2001]
train:
  train_size: 500
  val_size: 100
  train_seed: 501
  val_seed: 101
  steps: 50
  batch_size: 32
  eval_batch_size: 64
  lr: 0.0003
  compile: false
  bf16: true
model:
  embedding: 128
  heads: 4
  layers: 2
