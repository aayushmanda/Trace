# Boolean-8 on the character-token GPT (GPT-2L): outcome, answer-first and step supervision.
# Same settings as the archived run in results/paper/e1_five_condition_rerun/table1_rerun.csv, which also
# holds two conditions the paper no longer reports.
experiment: boolean8_gpt
bf16: true
tasks: [boolean_circuit_8]
modes: [outcome, answer_first, process]
seeds: [2001, 2002, 2003, 2004, 2005]
steps: 8000
train_size: 20000
val_size: 1000
train_seed: 501
val_seed: 101
batch_seed: 12345
batch_size: 128
eval_batch_size: 128
lr: 0.0003
weight_decay: 0.0
grad_clip: 1.0
embedding: 128
heads: 4
layers: 2
dropout: 0.0
workers: 0
output: results/paper/gpt/boolean8_gpt.csv
