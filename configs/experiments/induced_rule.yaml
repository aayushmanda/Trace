  checkpoints: [0, 500, 2000, 4000]
  lr: 0.0003
  batch_size: 128
  compile: false
  bf16: true
model:
  n_embd: 128
  n_head: 4
  n_layer: 4
out: results/revision/induced_rule.csv
ckpt_dir: results/revision/induced_ckpts
