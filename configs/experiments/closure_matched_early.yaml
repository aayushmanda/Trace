# Short same-architecture early-training protocol (not 6000-step accuracy).
# Process is the D-block outcome net trained with process tokens.
# Theory lives at P_g ≈ U: measure induced Rule credit at step 0 and the first
# few hundred updates. Do not claim ε^{D-1} from C_t without mixing radius.
experiment: closure_matched_early
mechanism_test: true
matched_architecture: true
induced_credit: true
induced_backgrounds: 2
lambda_local: 1.0
depth: 2
seed: 42
steps: 400
train_size: 2048
val_size: 128
probe_size: 32
patch_circuits: 8
batch_size: 64
lr: 0.0005
grad_clip: 1.0
probe_steps: 40
probe_lr: 0.05
train_eval_size: 32
train_seed: 123
val_seed: 8000
probe_seed: 9000
batch_seed: 2026
checkpoints: [0, 100, 200, 400]
skip_trained_patches: false
patch_donors: [0, 5, 10, 15]
compile: false
bf16: false
device: cuda:2
output: results/closure_handcoded/early_DEFAULT
conditions: [outcome, outcome_local, process]
note: >
  Same D-block architecture for outcome / outcome_local / process.
  Gold-prefix Def 20 readout at each checkpoint. Prefer cuda:2/3.
