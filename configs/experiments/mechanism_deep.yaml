# Sibling of outcome_local.yaml -- NOT a substitute for it, and its guarded
# `confirmation: {do_not_launch: true}` block is left untouched.
#
# Mechanism study: does a trained deep (D-block) outcome-only Transformer
# causally USE its per-block hidden state as the intermediate variable s_t,
# or is it merely decodable (probe_eval_accuracy high, patch accuracy low)?
# Extends src/eval/local_credit.py's activation-patching (already validated
# on the hand-coded oracle in tests/test_outcome_local.py) to the *trained*
# outcome / outcome_local models at each checkpoint, not just the oracle.
#
# Learning-rate / step-budget diagnostic (results/mechanism_deep/diagnostics/):
# tab:2x2 in the paper reports the deep outcome architecture diverging at
# lr=2e-3, D=4 in a single UNCLIPPED run (0.3% train accuracy). This repo's
# outcome-local pipeline already applies grad-clip=1.0 by default (unlike
# that reported run), and under that clip we found NO divergence at D=4 for
# lr in {2e-3, 1e-3, 5e-4, 2e-4}: all reach 22-45% held-out answer accuracy
# by step 1500 (chance = 1/16 = 6.25%). Extending to 5000 steps at
# train_size=10000 shows outcome/outcome_local still climbing well past 1500
# steps and roughly plateauing by ~3000-4000 steps. lr=5e-4 gave the best
# separation at step 5000 (seed 42, D=4): outcome 70.3%, outcome_local 89.8%,
# process 100.0% -- so the confirmation block's steps=2000 guess is NOT
# enough; this file uses steps=6000 with fine-grained checkpoints so the
# plateau is checked, not assumed. See results/mechanism_deep/SUMMARY.md.
experiment: mechanism_deep
mechanism_test: true
lambda_local: 1.0
depth: 4          # overridden per run via --depth
seed: 42          # overridden per run via --seed (model-init seed only)
steps: 6000
train_size: 10000
val_size: 256
probe_size: 64
patch_circuits: 32
batch_size: 128
lr: 0.0005
grad_clip: 1.0
probe_steps: 40
probe_lr: 0.05
train_seed: 123    # fixed across seeds: std dev over seeds = init variation only
val_seed: 8000
probe_seed: 9000
batch_seed: 2026
checkpoints: [0, 1000, 2000, 3000, 4000, 5000, 6000]
skip_trained_patches: false
compile: false
bf16: false
device: cuda
output: results/mechanism_deep/runs/DEFAULT
conditions: [outcome, outcome_local, process]
note: >
  Real GPU study (not a smoke test). Patches the trained outcome/outcome_local
  models (not just the hand-coded oracle) with oracle_slot / random_subspace /
  unstructured / wrong_layer at every checkpoint. process is skipped for
  patching (one-block, reused architecture; no per-step residual state slot),
  logged explicitly in persist.json's process_patching_not_applicable field.
