# Smoke / plumbing defaults for the mechanism test (deep outcome, answer-only).
# H_t is a linear residual-stream readout; no trace tokens in the outcome+local target.
# Mixed-format P̂_g is the negative transfer result, not this run.
# Do not claim ε^{D-1} from C_t; report C_t vs D only.
# Confirmation lives in configs/experiments/causal_identification.yaml (requires --confirm).
experiment: causal_identification
mechanism_test: true
lambda_local: 1.0
lambda: 1.0
depth: 2
seed: 42
steps: 80
train_size: 16
val_size: 8
probe_size: 8
patch_circuits: 4
batch_size: 8
lr: 0.01
grad_clip: 1.0
probe_steps: 40
probe_lr: 0.05
train_eval_size: 16
train_seed: 123
val_seed: 8000
probe_seed: 9000
batch_seed: 2026
checkpoints: [0, 40, 80]
compile: false
bf16: false
device: cpu
output: results/paper_revision_v2/causal_identification/smoke
conditions: [outcome, outcome_local, process]
note: "Smoke defaults. Held-out answer may stay 0; check train_loss and persist keys."

confirmation:
  do_not_launch: true
  yaml: configs/experiments/causal_identification.yaml
  depths: [2, 4, 6, 8]
  seeds: [42]
  steps: 2000
  train_size: 10000
  val_size: 256
  lambda_local: 1.0
