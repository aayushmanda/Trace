# If GPU budget is one job, run this. Hours, not a 20-seed grid.
# Requires --confirm. Directional split at fixed ρ; do not expect ρ_50 = 0.5.
experiment: closure_transformer_law
do_not_launch: true
depth: 4
seeds: [42]
steps: 2000
train_size: 10000
val_size: 256
batch_size: 128
lr: 0.0005
rhos: [0.05, 0.0625, 0.10, 0.25, 0.40, 0.49, 0.51, 0.60, 0.80]
laws: [symmetric, coherent]
conditions: [process]
checkpoints: [500, 1000, 2000]
train_seed: 123
val_seed: 8000
ratio_seed: 777
compile: false
bf16: false
device: cuda:2
output: results/closure_handcoded/transformer_law/confirm
note: >
  Same-architecture D-block (build_random_trainable_outcome_architecture)
  trained with process tokens. Two laws, ρ held fixed. SHIFT = directional
  split (symmetric recovers at lower ρ). NEGATIVE = no split. Offset from
  0.0625/0.5 toward ~0.85 is expected (D.10) and is not a failure.
  Minimum discriminating cell if the full grid is too long:
  --rhos 0.25 --laws symmetric coherent
