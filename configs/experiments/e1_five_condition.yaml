# E1 five-condition supervision (Table 1 family). Not the ~75-run interchange grid.
# Top-level keys are the **pilot** (safe). Confirmation hyperparameters are
# recorded under `confirmation:` and must not be launched from this file.
experiment: e1_five_condition
claim: "Five-condition GPT supervision (outcome / answer_first / filler / process / corrupted). Protocol freeze only."
compile: false
bf16: true
tasks: [boolean_circuit_8]
modes: [outcome, answer_first, filler, process, corrupted]
seeds: [2001]
steps: 100
train_size: 256
val_size: 32
train_seed: 501
val_seed: 101
batch_seed: 12345
batch_size: 8
eval_batch_size: 16
lr: 0.0003
weight_decay: 0.0
grad_clip: 1.0
embedding: 128
heads: 4
layers: 2
dropout: 0.0
workers: 0
output: results/paper_revision_v2/e1_five_condition/pilot.csv
note: "Pilot numbers are not Table 1. Do not paste into the PDF."

confirmation:
  do_not_launch_from_week2: true
  tasks: [boolean_circuit_8]
  modes: [outcome, answer_first, filler, process, corrupted]
  seeds: [2001, 2002, 2003, 2004, 2005]
  steps: 8000
  train_size: 20000
  val_size: 1000
  batch_size: 128
  embedding: 128
  heads: 4
  layers: 2
  lr: 0.0003
  output: results/paper_revision_v2/e1_five_condition/confirm.csv
